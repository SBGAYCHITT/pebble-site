<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>更新日志 — Pebble Launcher</title>
<meta name="description" content="Pebble Launcher 的版本历史与每次改了什么。">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!--@include:header-->

<main>
  <section class="page-head">
    <div class="wrap">
      <h1>更新日志</h1>
      <p>共 {{RELEASES_COUNT}} 个版本。当前最新是 v{{VER}}（{{DATE}}）。</p>
    </div>
  </section>

  <div class="wrap">
    <div class="rel-list-wrap">
      {{RELEASES}}
    </div>
  </div>

  <section class="section" style="padding-top:0">
    <div class="wrap">
      <div class="note">
        <b>不想手动下载？</b>启动器里把「设置 → 系统与更新 → 更新源」填成
        <code>{{ORIGIN}}/api/update/latest</code>，之后它会自己检查、自己下载、校验通过才替换。
      </div>
    </div>
  </section>
</main>

<!--@include:footer-->
</body>
</html>
